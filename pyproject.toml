[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scenecraft"
version = "0.1.0"
description = "Turn scripts into finished videos with AI visuals, local narration, word-synced subtitles, and FFmpeg assembly."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Scenecraft Contributors" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "numpy>=1.24.0",
    "pillow>=9.5.0",
    "soundfile>=0.12.0",
    "faster-whisper>=1.0.0",
    "onnxruntime>=1.15.0",
    "opencv-python-headless>=4.7.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "tqdm>=4.65.0",
    "psutil>=5.9.0",
    "platformdirs>=3.0.0",
    "edge-tts>=6.1.0",
    "requests>=2.28.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
gpu = [
    "onnxruntime-gpu>=1.15.0",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
scenecraft = "scenecraft.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scenecraft*"]
