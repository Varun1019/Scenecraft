[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scenecraft-mcp"
version = "0.1.0"
description = "MCP Server for Scenecraft automated video production"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scenecraft",
    "mcp>=1.0.0",
]

[project.scripts]
scenecraft-mcp = "mcp_server.server:main"
